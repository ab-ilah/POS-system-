name: ci

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check permissions matrix sync
        env:
          # Staging PRs/pushes diff against backend staging; main against backend main.
          BACKEND_REF: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: npm run permissions:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-credential

      - name: Scan bundle
        run: npm run scan:bundle
        env:
          # Exact key match is post-merge only. Pull requests, including forks, receive no secrets.
          BUNDLE_SCAN_FORBIDDEN_SECRET: ${{ github.event_name == 'push' && secrets.BUNDLE_SCAN_FORBIDDEN_SECRET || '' }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke test
        run: npm run test:e2e
